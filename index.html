<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 재활 운동 앱 (UnTurtle)</title>
    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAaWK4Rrrn-i2cKuFnNOQ_xpSljhB9eBJk",
            authDomain: "capstonesever-34cd2.firebaseapp.com",
            projectId: "capstonesever-34cd2",
            storageBucket: "capstonesever-34cd2.firebasestorage.app",
            messagingSenderId: "396870369963",
            appId: "1:396870369963:web:6e22c680bc11703026edee",
            measurementId: "G-7Q674G0TXY"
        };  

        // ✅ 올바른 순서: app을 먼저 초기화한 다음 analytics를 불러와야 합니다.
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        let currentUser = null;

        // 전역 함수로 노출 (HTML 인라인 이벤트에서 사용하기 위함)
        window.navigate = function(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            // 캘린더 화면 진입 시 데이터 불러오기
            if(viewId === 'view-calendar' && currentUser) {
                loadCalendarData();
                document.getElementById('welcome-sheet').style.transform = 'translateY(0)';
            }
        };

        window.closeSheet = function() {
            document.getElementById('welcome-sheet').style.transform = 'translateY(100%)';
        };

        // 회원가입 로직
        window.handleSignup = async function() {
            const email = document.getElementById('signup-email').value;
            const pw = document.getElementById('signup-pw').value;
            const name = document.getElementById('signup-name').value;
            
            if(!email || !pw || !name) return alert('모든 정보를 입력해주세요.');

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pw);
                const user = userCredential.user;
                
                // Firestore에 유저 정보 저장 
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    createdAt: new Date().toISOString()
                });
                
                logEvent(analytics, 'sign_up', { method: 'Email' });

                alert('회원가입이 완료되었습니다!');
                navigate('view-login');
            } catch (error) {
                alert('회원가입 실패: ' + error.message);
            }
        };

        // 로그인 로직
        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value;
            const pw = document.getElementById('login-pw').value;
            
            try {
                await signInWithEmailAndPassword(auth, email, pw);
                logEvent(analytics, 'login', { method: 'Email' });
            } catch (error) {
                alert('로그인 실패: 아이디나 비밀번호를 확인해주세요.');
            }
        };

        // 사진 측정 및 결과 저장 로직
        window.saveMeasurement = async function() {
            if(!currentUser) return;
            
            try {
                // 가상의 측정 결과 데이터 DB 저장
                await addDoc(collection(db, "measurements"), {
                    uid: currentUser.uid,
                    date: new Date().toISOString(),
                    angle: 84, // 예시: MediaPipe로 측정한 각도
                    status: "좋음"
                });
                
                logEvent(analytics, 'measurement_completed', { angle: 84 });

                alert('측정이 완료되어 데이터가 저장되었습니다.');
                updateMainUI(84, "좋음");
                navigate('view-main');
            } catch (error) {
                console.error("측정 데이터 저장 에러: ", error);
            }
        };

        // 캘린더 척추 각도 개선도 계산
        async function loadCalendarData() {
            try {
                const q = query(collection(db, "measurements"), where("uid", "==", currentUser.uid), orderBy("date", "desc"), limit(2));
                const querySnapshot = await getDocs(q);
                const records = [];
                querySnapshot.forEach((doc) => records.push(doc.data()));

                const resultMsg = document.getElementById('angle-result');
                if(records.length >= 2) {
                    const diff = Math.abs(records[0].angle - records[1].angle);
                    document.getElementById('angle-diff-val').innerText = `${diff}도`;
                    resultMsg.style.display = 'block';
                } else {
                    resultMsg.style.display = 'none'; // 데이터 부족 시 숨김
                }
            } catch(e) {
                console.error(e);
            }
        }

        // 메인 화면 UI 업데이트
        function updateMainUI(angle, status) {
            document.getElementById('val-angle').innerText = angle ? `${angle}º 정도` : '측정 필요';
            document.getElementById('val-status').innerText = status || '측정 필요';
            document.getElementById('val-status').style.color = status === '좋음' ? '#3182f6' : '#fff';
            document.getElementById('tooltip-msg').innerText = angle ? '오늘 운동을 하지 않았습니다.' : '측정이 필요합니다.';
        }

        // 로그인 상태 감지
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                navigate('view-main');
            } else {
                currentUser = null;
                navigate('view-login');
            }
        });
    </script>
    
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #3182f6; --text: #f9f9f9; --text-sub: #8b95a1; }
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Pretendard', -apple-system, sans-serif; }
        
        /* 모바일 뷰 컨테이너 (PC에서도 깨지지 않게 중앙 480px 고정) */
        .app-container { width: 100%; max-width: 480px; height: 100vh; max-height: 900px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* SPA 뷰 전환 스타일 */
        .view { display: none; height: 100%; width: 100%; flex-direction: column; overflow-y: auto; padding: 24px; box-sizing: border-box; position: absolute; top: 0; left: 0; background: var(--bg);}
        .view.active { display: flex; }

        /* 공통 UI 요소 */
        h1 { font-size: 24px; margin-bottom: 30px; font-weight: 700; text-align: center; color: var(--text); }
        input, select { width: 100%; background: var(--surface); border: none; padding: 18px; border-radius: 12px; color: var(--text); font-size: 16px; margin-bottom: 15px; box-sizing: border-box;}
        input::placeholder { color: var(--text-sub); }
        .btn { width: 100%; background: var(--primary); color: #fff; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; display: block; box-sizing: border-box;}
        
        /* 네비게이션 바 */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--surface); display: flex; padding: 15px 0; border-top: 1px solid #333; z-index: 10; }
        .nav-item { flex: 1; text-align: center; color: var(--text-sub); font-size: 14px; font-weight: 600; border-right: 1px solid #333; cursor: pointer; }
        .nav-item:last-child { border-right: none; }
        .nav-item:hover, .nav-item:active { color: var(--primary); }

        /* 메인 화면 전용 */
        .data-card { background: var(--surface); border-radius: 20px; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; position: relative; margin-top: 20px;}
        .data-item h3 { font-size: 13px; color: var(--text-sub); margin: 0 0 8px 0; font-weight: 500; }
        .data-item p { font-size: 22px; font-weight: 700; margin: 0; color: var(--text); }
        .tooltip { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); background: #333; padding: 10px 16px; border-radius: 8px; font-size: 13px; white-space: nowrap; color: #fff; }
        
        /* 카메라 화면 전용 */
        .camera-controls { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: space-evenly; align-items: center; }
        .capture-btn { width: 70px; height: 70px; border: 4px solid #fff; border-radius: 50%; background: #333; cursor: pointer; }

        /* 캘린더 전용 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; margin-bottom: 20px; color: var(--text); }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: #222; border-radius: 24px 24px 0 0; padding: 30px 20px; text-align: center; transform: translateY(100%); transition: transform 0.3s ease; z-index: 20; box-sizing: border-box;}
    </style>
</head>
<body>

<div class="app-container">

    <!-- 1. 로그인 화면 -->
    <div id="view-login" class="view active" style="justify-content: center;">
        <h1>AI 재활 운동 앱</h1>
        <input type="text" id="login-email" placeholder="아이디(이메일)를 입력해주세요">
        <input type="password" id="login-pw" placeholder="비밀번호를 입력해주세요">
        <button class="btn" onclick="handleLogin()">로그인</button>
        <div style="display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px;">
            <a href="#" style="color: var(--text-sub); text-decoration: none;">아이디/비밀번호 찾기</a>
            <a href="#" onclick="navigate('view-signup')" style="color: var(--text); font-weight: 600; text-decoration: none;">회원가입</a>
        </div>
    </div>

    <!-- 2. 회원가입 화면 -->
    <div id="view-signup" class="view" style="justify-content: center;">
        <h1>회원가입</h1>
        <input type="text" id="signup-name" placeholder="이름 (예: 이성재)">
        <input type="email" id="signup-email" placeholder="이메일 (아이디)">
        <input type="password" id="signup-pw" placeholder="비밀번호">
        <div style="display: flex; gap: 10px;">
            <input type="number" placeholder="나이">
            <select>
                <option value="male">남성</option>
                <option value="female">여성</option>
            </select>
        </div>
        <button class="btn" onclick="handleSignup()">가입하기</button>
        <button class="btn" style="background: transparent; color: var(--text-sub); margin-top: 10px;" onclick="navigate('view-login')">취소</button>
    </div>

    <!-- 3. 메인 화면 -->
    <div id="view-main" class="view" style="padding-bottom: 100px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 20px;">
            <div style="font-size: 20px; font-weight: 700; background: var(--surface); padding: 8px 16px; border-radius: 8px; color: var(--text);">이성재</div>
            <div style="color: var(--text-sub); font-size: 14px;">2026.09.20</div>
        </div>

        <div style="font-size: 18px; font-weight: 700; margin-bottom: 12px; color: var(--text);">데이터</div>
        <div class="data-card">
            <div class="data-item">
                <h3>척추 각도</h3>
                <p id="val-angle">측정 필요</p>
            </div>
            <div class="data-item">
                <h3>현재 상태</h3>
                <p id="val-status">측정 필요</p>
            </div>
            <div class="data-item">
                <h3>일일 휴대폰 사용 시간</h3>
                <p>8시간</p>
            </div>
            <div class="data-item">
                <h3>루틴 횟수</h3>
                <p>0일차</p>
            </div>
            <div class="tooltip" id="tooltip-msg">측정이 필요합니다.</div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" style="color: var(--primary);" onclick="navigate('view-measure')">측정</div>
            <div class="nav-item" onclick="navigate('view-exercise')">운동 시작</div>
            <div class="nav-item" onclick="navigate('view-calendar')">캘린더</div>
        </div>
    </div>

    <!-- 4. 측정 화면 -->
    <div id="view-measure" class="view" style="background: #000;">
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;">
            <svg width="150" viewBox="0 0 100 200" stroke="#fff" stroke-width="2" fill="none" style="opacity: 0.5;">
                <circle cx="50" cy="30" r="20"/>
                <line x1="50" y1="50" x2="50" y2="120"/>
                <line x1="10" y1="70" x2="90" y2="70"/>
                <line x1="50" y1="120" x2="20" y2="180"/>
                <line x1="50" y1="120" x2="80" y2="180"/>
            </svg>
            <div style="margin-top: 20px; font-size: 14px; font-weight: bold; letter-spacing: 2px; color: #fff;">Actor</div>
        </div>
        <div class="camera-controls">
            <div style="color: white; font-size: 24px; cursor: pointer;" onclick="navigate('view-main')">✕</div>
            <!-- 촬영 버튼 클릭 시 DB 연동 함수 실행 -->
            <button class="capture-btn" onclick="saveMeasurement()"></button>
            <div style="color: white; font-size: 24px;">⟳</div>
        </div>
    </div>

    <!-- 5. 운동 화면 -->
    <div id="view-exercise" class="view" style="padding-bottom: 100px;">
        <h1>운동 시작(교정)</h1>
        <div style="background: var(--surface); text-align: center; padding: 15px; border-radius: 12px; font-size: 22px; font-weight: 700; margin-bottom: 30px; border: 1px solid #333; color: var(--text);">1일차</div>
        
        <div style="background: var(--surface); padding: 20px; border-radius: 20px; border: 1px solid #333;">
            <div style="background: var(--bg); padding: 20px; border-radius: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 500; color: var(--text);">팔꿈치를 높이 올리고<br>엄지로 턱 받치기</span>
                <div style="width: 40px; height: 40px; border: 1px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff;">▷</div>
            </div>
            <!-- 동일 구조 반복 생략 -->
        </div>
        
        <button class="btn" style="margin-top: 20px;" onclick="alert('루틴 완료!'); navigate('view-main')">운동 완료</button>

        <div class="bottom-nav">
            <div class="nav-item" onclick="navigate('view-measure')">측정</div>
            <div class="nav-item" style="color: var(--primary);" onclick="navigate('view-exercise')">운동 시작</div>
            <div class="nav-item" onclick="navigate('view-calendar')">캘린더</div>
        </div>
    </div>

    <!-- 6. 캘린더 화면 -->
    <div id="view-calendar" class="view" style="padding-bottom: 100px;">
        <h1>캘린더</h1>
        <div style="background: var(--surface); border-radius: 20px; padding: 20px; margin-bottom: 20px;">
            <div class="calendar-grid">
                <div style="color: var(--text-sub);">일</div><div style="color: var(--text-sub);">월</div><div style="color: var(--text-sub);">화</div><div style="color: var(--text-sub);">수</div><div style="color: var(--text-sub);">목</div><div style="color: var(--text-sub);">금</div><div style="color: var(--text-sub);">토</div>
                <div></div><div>1</div><div>2</div><div>3</div><div>4</div><div style="color: var(--primary);">5</div>
                <div style="color: #ff5252;">6</div><div>7</div><div>8</div><div>9</div><div>10</div>
            </div>
            
            <div id="angle-result" style="text-align: center; font-size: 15px; font-weight: 600; margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; display: none; color: var(--text);">
                😊 척추 각도가 전보다 <span id="angle-diff-val" style="color: var(--primary); font-size: 18px;"></span> 정도 좋아졌어요!
            </div>
        </div>

        <div class="bottom-sheet" id="welcome-sheet">
            <h2 style="font-size: 14px; color: var(--text-sub); margin-bottom: 10px;">연속 방문</h2>
            <h1 style="font-size: 32px; margin-bottom: 30px; color: var(--text);">1일차</h1>
            <button class="btn" style="background: transparent; border: 1px solid #555;" onclick="closeSheet()">확인했어요</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="navigate('view-measure')">측정</div>
            <div class="nav-item" onclick="navigate('view-exercise')">운동 시작</div>
            <div class="nav-item" style="color: var(--primary);" onclick="navigate('view-calendar')">캘린더</div>
        </div>
    </div>

</div>

</body>
</html>
