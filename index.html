<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 재활 운동 앱 (UnTurtle)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";

        // 본인의 파이어베이스 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyAaWK4Rrrn-i2cKuFnNOQ_xpSljhB9eBJk",
            authDomain: "capstonesever-34cd2.firebaseapp.com",
            projectId: "capstonesever-34cd2",
            storageBucket: "capstonesever-34cd2.firebasestorage.app",
            messagingSenderId: "396870369963",
            appId: "1:396870369963:web:6e22c680bc11703026edee",
            measurementId: "G-7Q674G0TXY"
        };  

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        let currentUser = null;
        let camera = null;
        
        let boneLevel = 0;
        let gold = 10000;
        let shields = 0;

        window.navigate = function(viewId, navElement) {
            // 모든 뷰 숨기고 선택한 뷰만 표시
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            // ✅ 로그인/회원가입 화면에서는 하단 바 숨기기
            const bottomNav = document.getElementById('main-bottom-nav');
            if(viewId === 'view-login' || viewId === 'view-signup') {
                bottomNav.style.display = 'none';
            } else {
                bottomNav.style.display = 'flex';
            }

            // 하단 네비게이션 활성화 표시
            if(navElement) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                navElement.classList.add('active');
            }

            if(viewId === 'view-measure') startMediaPipeCamera();
            else stopMediaPipeCamera();

            if(viewId === 'view-game' && currentUser) loadGameData();
        };

        // 회원가입
        window.handleSignup = async function() {
            const email = document.getElementById('signup-email').value;
            const pw = document.getElementById('signup-pw').value;
            const name = document.getElementById('signup-name').value;
            if(!email || !pw || !name) return alert('모든 정보를 입력해주세요.');

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pw);
                await setDoc(doc(db, "users", userCredential.user.uid), {
                    name: name,
                    email: email,
                    boneLevel: 0,
                    gold: 10000,
                    shields: 0,
                    createdAt: new Date().toISOString()
                });
                logEvent(analytics, 'sign_up', { method: 'Email' });
                alert('회원가입 완료!');
                navigate('view-login');
            } catch (error) { alert('회원가입 실패: ' + error.message); }
        };

        // 로그인
        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value;
            const pw = document.getElementById('login-pw').value;
            try {
                await signInWithEmailAndPassword(auth, email, pw);
                logEvent(analytics, 'login', { method: 'Email' });
            } catch (error) { alert('로그인 실패'); }
        };

        // CVA 측정 (MediaPipe)
        function startMediaPipeCamera() {
            const videoElement = document.getElementById('webcam');
            const feedbackText = document.getElementById('measure-feedback');
            const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
            pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            pose.onResults((results) => {
                if (!results.poseLandmarks) return;
                const ear = results.poseLandmarks[7];
                const shoulder = results.poseLandmarks[11];
                if (ear && shoulder) {
                    const angle = Math.round(Math.atan2(Math.abs(ear.y - shoulder.y), Math.abs(ear.x - shoulder.x)) * (180 / Math.PI));
                    feedbackText.innerText = `측정 중... 감지된 각도: ${angle}°`;
                    if (angle > 30) {
                        feedbackText.innerText = `✅ 측정 성공! 각도: ${angle}°`;
                        setTimeout(() => saveMeasurementResult(angle), 1500);
                    }
                }
            });
            camera = new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 480, height: 640 });
            camera.start();
        }

        function stopMediaPipeCamera() { if (camera) camera = null; }

        async function saveMeasurementResult(angle) {
            if(!currentUser) return;
            try {
                await addDoc(collection(db, "measurements"), { uid: currentUser.uid, date: new Date().toISOString(), angle: angle, status: angle > 50 ? "좋음" : "주의" });
                logEvent(analytics, 'measurement_completed', { angle: angle });
                alert(`측정 완료! 각도: ${angle}°`);
                navigate('view-main', document.getElementById('nav-home'));
            } catch(e) { console.error(e); }
        }

        // =======================
        // 🎮 미니게임 로직 (척추 강화)
        // =======================
        
        async function loadGameData() {
            const docSnap = await getDoc(doc(db, "users", currentUser.uid));
            if (docSnap.exists()) {
                const data = docSnap.data();
                boneLevel = data.boneLevel || 0;
                gold = data.gold || 0;
                shields = data.shields || 0;
                updateGameUI();
            }
        }

        async function saveGameData() {
            if(currentUser) {
                await updateDoc(doc(db, "users", currentUser.uid), { boneLevel, gold, shields });
            }
        }

        function getUpgradeProb(lvl) {
            if (lvl < 10) return 90;      
            if (lvl < 15) return 50;      
            if (lvl < 20) return 15;      
            return 3;                     
        }

        function getBoneIcon(lvl) {
            if (lvl < 5) return "🦴";
            if (lvl < 10) return "🦴✨";
            if (lvl < 15) return "🦾";
            if (lvl < 20) return "⚡🐉";
            return "🌌👑";
        }

        window.upgradeBone = function() {
            const cost = 500 + (boneLevel * 200);
            if (gold < cost) return alert(`골드가 부족합니다! (필요: ${cost}G)`);
            
            gold -= cost;
            const prob = getUpgradeProb(boneLevel);
            const roll = Math.random() * 100;
            const logBox = document.getElementById('game-log');

            if (roll <= prob) {
                boneLevel++;
                logBox.innerHTML = `<span style="color:#3182f6;">[성공] +${boneLevel}강 척추가 되었습니다! (성공률 ${prob}%)</span>`;
                logEvent(analytics, 'game_upgrade_success', { level: boneLevel });
            } else {
                if (shields > 0) {
                    shields--;
                    logBox.innerHTML = `<span style="color:#ff9800;">[실패] 강화보호권이 사용되어 척추가 파괴되지 않았습니다!</span>`;
                } else {
                    boneLevel = 0;
                    logBox.innerHTML = `<span style="color:#ff5252;">[파괴] 척추가 바스라졌습니다... 0강으로 초기화됩니다.</span>`;
                }
                logEvent(analytics, 'game_upgrade_fail', { level: boneLevel });
            }
            updateGameUI();
            saveGameData();
        };

        window.buyShield = function() {
            if (gold < 5000) return alert("골드가 부족합니다! (필요: 5000G)");
            gold -= 5000;
            shields++;
            document.getElementById('game-log').innerHTML = `<span style="color:#4CAF50;">강화보호권을 구매했습니다!</span>`;
            updateGameUI();
            saveGameData();
        };

        window.sellBone = function() {
            if (boneLevel === 0) return alert("0강 뼈는 팔 수 없습니다.");
            const reward = boneLevel * 1500;
            gold += reward;
            document.getElementById('game-log').innerHTML = `<span style="color:#e91e63;">+${boneLevel}강 척추를 팔아 ${reward}G를 얻었습니다!</span>`;
            boneLevel = 0;
            updateGameUI();
            saveGameData();
        };

        function updateGameUI() {
            document.getElementById('bone-icon').innerText = getBoneIcon(boneLevel);
            document.getElementById('bone-level-text').innerText = `+${boneLevel} 척추`;
            document.getElementById('user-gold').innerText = `${gold} G`;
            document.getElementById('user-shields').innerText = `${shields} 개`;
            
            const nextProb = getUpgradeProb(boneLevel);
            const cost = 500 + (boneLevel * 200);
            document.getElementById('upgrade-info').innerText = `성공 확률: ${nextProb}% | 비용: ${cost}G`;
        }

        onAuthStateChanged(auth, (user) => {
            if (user) { 
                currentUser = user; 
                navigate('view-main', document.getElementById('nav-home')); 
            } else { 
                currentUser = null; 
                navigate('view-login'); 
            }
        });
    </script>

    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #3182f6; --text: #f9f9f9; --text-sub: #8b95a1; }
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Pretendard', sans-serif; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; max-height: 900px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .view { display: none; height: 100%; width: 100%; flex-direction: column; overflow-y: auto; padding: 24px; padding-bottom: 90px; box-sizing: border-box; position: absolute; top: 0; left: 0; background: var(--bg); }
        .view.active { display: flex; }
        h1 { font-size: 24px; margin-bottom: 20px; font-weight: 700; text-align: center; color: var(--text); }
        input { width: 100%; background: var(--surface); border: none; padding: 18px; border-radius: 12px; color: var(--text); font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; background: var(--primary); color: #fff; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; display: block; box-sizing: border-box; margin-bottom: 10px;}
        
        /* ✅ 하단 네비게이션바 (초기 display: none 설정) */
        .bottom-nav { display: none; position: absolute; bottom: 0; left: 0; width: 100%; background: var(--surface); padding: 15px 0; border-top: 1px solid #333; z-index: 10; }
        .nav-item { flex: 1; text-align: center; color: var(--text-sub); font-size: 13px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        /* 게임 UI 스타일 */
        .game-header { display: flex; justify-content: space-between; background: var(--surface); padding: 15px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; }
        .bone-display { text-align: center; margin: 30px 0; }
        .bone-icon { font-size: 80px; display: inline-block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .log-box { background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; font-size: 14px; min-height: 20px; text-align: center; margin-bottom: 20px; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 1. 로그인 화면 -->
    <div id="view-login" class="view active" style="justify-content: center;">
        <h1>UnTurtle 로그인</h1>
        <input type="text" id="login-email" placeholder="이메일 입력">
        <input type="password" id="login-pw" placeholder="비밀번호 입력">
        <button class="btn" onclick="handleLogin()">로그인</button>
        <button class="btn" style="background:transparent; color:var(--text-sub);" onclick="navigate('view-signup')">회원가입하기</button>
    </div>

    <!-- 2. 회원가입 화면 -->
    <div id="view-signup" class="view" style="justify-content: center;">
        <h1>회원가입</h1>
        <input type="text" id="signup-name" placeholder="이름">
        <input type="email" id="signup-email" placeholder="이메일">
        <input type="password" id="signup-pw" placeholder="비밀번호">
        <button class="btn" onclick="handleSignup()">가입 완료</button>
        <button class="btn" style="background:transparent; color:var(--text-sub);" onclick="navigate('view-login')">돌아가기</button>
    </div>

    <!-- 3. 메인 대시보드 -->
    <div id="view-main" class="view">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="font-size: 20px; font-weight: 700;">내 데이터 요약</div>
        </div>
        <div style="background:var(--surface); border-radius:20px; padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:24px;">
            <div><p style="color:var(--text-sub); font-size:13px; margin:0 0 5px 0;">척추 각도</p><p style="font-size:22px; font-weight:bold; margin:0;">84º 정도</p></div>
            <div><p style="color:var(--text-sub); font-size:13px; margin:0 0 5px 0;">현재 상태</p><p style="font-size:22px; font-weight:bold; color:var(--primary); margin:0;">좋음</p></div>
            <div><p style="color:var(--text-sub); font-size:13px; margin:0 0 5px 0;">휴대폰 사용</p><p style="font-size:22px; font-weight:bold; margin:0;">8시간</p></div>
            <div><p style="color:var(--text-sub); font-size:13px; margin:0 0 5px 0;">루틴 횟수</p><p style="font-size:22px; font-weight:bold; margin:0;">5일차</p></div>
        </div>
    </div>

    <!-- 4. 실시간 카메라 CVA 측정 -->
    <div id="view-measure" class="view" style="background:#000; padding:0;">
        <div style="position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <video id="webcam" autoplay playsinline style="width:100%; height:100%; object-fit:cover; position:absolute;"></video>
            <div id="measure-feedback" style="position:absolute; top:30px; background:rgba(0,0,0,0.8); color:#fff; padding:12px 24px; border-radius:20px; font-weight:bold; border: 2px solid var(--primary);">
                측면 카메라를 맞춰주세요...
            </div>
            <button class="btn" style="position:absolute; bottom:30px; width:80%;" onclick="navigate('view-main', document.getElementById('nav-home'))">측정 취소</button>
        </div>
    </div>
    
    <!-- 5. 캘린더 화면 -->
    <div id="view-calendar" class="view">
        <h1>운동 캘린더</h1>
        <div style="background:var(--surface); border-radius:20px; padding:20px;">
            <p style="text-align:center; color:var(--text-sub);">이번 달 기록 내역</p>
            <p style="text-align:center; font-size:20px; font-weight:bold;">🔥 5일 연속 출석!</p>
        </div>
    </div>

    <!-- 6. 🎮 미니게임 탭 -->
    <div id="view-game" class="view">
        <h1>척추 공방</h1>
        
        <div class="game-header">
            <div>💰 <span id="user-gold">0 G</span></div>
            <div>🛡️ 보호권: <span id="user-shields">0 개</span></div>
        </div>

        <div class="bone-display">
            <div class="bone-icon" id="bone-icon">🦴</div>
            <h2 id="bone-level-text" style="color:var(--primary); font-size:28px; margin-top:10px;">+0 척추</h2>
            <p id="upgrade-info" style="color:var(--text-sub); font-size:14px;">성공 확률: 90% | 비용: 500G</p>
        </div>

        <div class="log-box" id="game-log">
            강화 버튼을 눌러 척추를 단련하세요!
        </div>

        <button class="btn" style="background:#e91e63; padding:20px; font-size:20px;" onclick="upgradeBone()">🔨 강화하기</button>
        
        <div class="game-grid">
            <button class="btn" style="background:#ff9800; font-size:14px;" onclick="buyShield()">🛡️ 보호권 구매 (5000G)</button>
            <button class="btn" style="background:#9c27b0; font-size:14px;" onclick="sellBone()">💸 현재 뼈 팔기</button>
        </div>
    </div>

    <!-- ✅ 하단 고정 네비게이션바 -->
    <div class="bottom-nav" id="main-bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="navigate('view-main', this)">홈</div>
        <div class="nav-item" onclick="navigate('view-measure', this)">자세측정</div>
        <div class="nav-item" onclick="navigate('view-calendar', this)">캘린더</div>
        <div class="nav-item" onclick="navigate('view-game', this)">뼈강화🎮</div>
    </div>

</div>

</body>
</html>
